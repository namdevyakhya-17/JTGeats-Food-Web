<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTGeats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <div class="logo">JTGeats</div>
            <div class="nav-menu">
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Menu</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
                <div class="nav-icons">
                    <span class="icon">🔍</span>
                    <span class="icon">🛒</span>
                </div>
            </div>
        </nav>
    </header>

    <section class="hero">
        <div class="container hero-main">
            <div class="hero-text">
                <div class="hero-text-content">
                    <h1>Authentic Home food in India</h1>
                    <p>JTGeats is a courier service in which authentic home cook food is delivered to a customer</p>
                </div>
                <div class="search-box">
                    <input type="text" placeholder="Search food you love" />
                    <button>Search</button>
                </div>
            </div>
            <div class="hero-image">
                <img src="assets/images/hero.png" alt="Chef-Image"/>
            </div>
        </div>
    </section>
</body>
</html>
