<div class="modal-overlay hidden" id="dishModal">
    <div class="modal-box">
        <h2>Craving Something Else?</h2>
        <input type="text" placeholder="Dish Name">
        <input type="text" placeholder="Cuisine Type">
        <textarea placeholder="Any customization or spice preference?"></textarea>
        <div class="modal-actions">
            <button class="cancel-btn" id="cancelDish" type="button">Cancel</button>
            <button class="submit-btn" id="submitDish" type="button">Submit Request</button>
        </div>
    </div>
</div>
